<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" font-family="Helvetica, Arial, sans-serif">
<title>323SUT lithium battery wiring layout</title>
<desc>Two Renogy Reserve Mini 314Ah batteries connect with equal-length 2/0 cables to a positive bus bar above and a negative bus bar below. The positive bar feeds a 300 A Class T fuse to the RV 12V system and a 40 A breaker to the Rover 2 solar controller; both return to the negative bar.</desc>
<rect width="680" height="440" fill="#ffffff"/>
<g font-size="14" text-anchor="middle" dominant-baseline="central">
<rect x="40" y="60" width="170" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="125" y="74" fill="#444441" font-weight="bold">Rover 2 30A MPPT</text><text x="125" y="92" fill="#5F5E5A" font-size="12">From 200 W panel</text>
<rect x="450" y="60" width="190" height="44" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="545" y="74" fill="#444441" font-weight="bold">RV 12V system</text><text x="545" y="92" fill="#5F5E5A" font-size="12">Via disconnect switch</text>
<rect x="60" y="150" width="110" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="115" y="167" fill="#712B13" font-weight="bold">40 A breaker</text>
<rect x="180" y="150" width="260" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="310" y="167" fill="#712B13" font-weight="bold">Positive bus bar 400 A</text>
<rect x="470" y="150" width="130" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="535" y="167" fill="#712B13" font-weight="bold">Class T 300 A</text>
<rect x="180" y="230" width="120" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="240" y="252" fill="#085041" font-weight="bold">Battery 1</text><text x="240" y="272" fill="#0F6E56" font-size="12">Renogy 314Ah</text>
<rect x="320" y="230" width="120" height="60" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="380" y="252" fill="#085041" font-weight="bold">Battery 2</text><text x="380" y="272" fill="#0F6E56" font-size="12">Renogy 314Ah</text>
<rect x="180" y="340" width="260" height="34" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="310" y="357" fill="#444441" font-weight="bold">Negative bus bar 400 A</text>
</g>
<g fill="none">
<line x1="210" y1="230" x2="210" y2="184" stroke="#D85A30" stroke-width="2.5"/>
<line x1="350" y1="230" x2="350" y2="184" stroke="#D85A30" stroke-width="2.5"/>
<line x1="270" y1="290" x2="270" y2="340" stroke="#5F5E5A" stroke-width="2.5"/>
<line x1="410" y1="290" x2="410" y2="340" stroke="#5F5E5A" stroke-width="2.5"/>
<line x1="440" y1="167" x2="470" y2="167" stroke="#D85A30" stroke-width="2.5"/>
<line x1="535" y1="150" x2="535" y2="104" stroke="#D85A30" stroke-width="2.5"/>
<line x1="180" y1="167" x2="170" y2="167" stroke="#D85A30" stroke-width="1.5"/>
<line x1="115" y1="150" x2="115" y2="104" stroke="#D85A30" stroke-width="1.5"/>
<path d="M40 82 L26 82 L26 357 L180 357" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M620 104 L620 357 L440 357" stroke="#5F5E5A" stroke-width="2.5"/>
</g>
<g font-size="12" fill="#5F5E5A" dominant-baseline="central">
<line x1="60" y1="410" x2="84" y2="410" stroke="#D85A30" stroke-width="2.5"/><text x="92" y="410">Positive</text>
<line x1="170" y1="410" x2="194" y2="410" stroke="#5F5E5A" stroke-width="2.5"/><text x="202" y="410">Negative</text>
<text x="290" y="410">Thick = 2/0 cable, thin = 8 AWG controller wire</text>
</g>
</svg>
